<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeggieLens — Camera Finder</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #3fb950;
      --accent2: #58a6ff;
      --warn: #f78166;
      --text: #e6edf3;
      --muted: #7d8590;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header span { color: var(--muted); font-size: 0.85rem; }
    .cam-row {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 14px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost:hover { border-color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      padding: 20px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .card h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .video-wrap {
      position: relative;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 4/3;
      border: 1px solid var(--border);
    }
    video, #snapshot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #snapshot { display: none; }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .timing {
      margin-top: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .timing .ms {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .timing .lbl { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .result-idle {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .top-match {
      padding: 14px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--accent);
      margin-bottom: 12px;
    }
    .top-match .label { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
    .top-match .pct { font-size: 1rem; margin-top: 4px; }
    .result-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .result-row:last-child { border-bottom: none; }
    .result-rank { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .result-label { font-weight: 600; margin: 4px 0; }
    .bar-track {
      height: 6px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
      margin: 6px 0;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0;
      transition: width 0.5s ease;
    }
    .bar-fill.second { background: var(--accent2); }
    .bar-fill.third { background: var(--muted); }
    .meta { font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; }
    .error { color: var(--warn); padding: 12px; }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .feedback-card { margin-top: 16px; }
    .feedback-actions { display: flex; flex-direction: column; gap: 8px; }
    .feedback-actions button.confirm { background: #238636; border-color: #238636; color: #fff; font-weight: 600; }
    .feedback-actions button.correct { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .feedback-actions button.new-prod { background: #8957e5; border-color: #8957e5; color: #fff; }
    .feedback-panel {
      margin-top: 10px; padding: 10px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .feedback-panel label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .autocomplete-wrap { position: relative; }
    .autocomplete-wrap input {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .suggestions {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 10;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; margin-top: 4px; max-height: 160px; overflow-y: auto;
    }
    .suggestions div {
      padding: 8px 10px; cursor: pointer; font-size: 0.85rem;
    }
    .suggestions div:hover, .suggestions div.active { background: var(--bg); color: var(--accent); }
    .panel-actions { display: flex; gap: 8px; margin-top: 10px; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--accent);
      color: var(--text); padding: 10px 18px; border-radius: 10px;
      font-size: 0.85rem; z-index: 100; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .feedback-hint { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>VeggieLens <span>EfficientNet-B3 · 27 classes</span></h1>
    <div class="cam-row">
      <label for="cameraSelect" style="color:var(--muted);font-size:0.8rem">Camera</label>
      <select id="cameraSelect"></select>
    </div>
  </header>

  <main>
    <section>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <img id="snapshot" alt="capture">
        <div id="placeholder" class="video-placeholder">Starting camera…</div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="findBtn" disabled>Find</button>
        <button type="button" class="ghost" id="clearBtn" disabled>Clear</button>
      </div>
      <p style="margin-top:10px;color:var(--muted);font-size:0.8rem">
        Point at a vegetable or fruit, then press <strong>Find</strong> (or <kbd>Space</kbd>).
      </p>
    </section>

    <aside>
      <div class="card">
        <h2>Detection time</h2>
        <div class="timing">
          <div class="ms" id="msVal">—</div>
          <div class="lbl">inference (ms)</div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>Results</h2>
        <div id="results">
          <div class="result-idle">Press <strong>Find</strong> to classify</div>
        </div>
      </div>
      <div class="card feedback-card" id="feedbackCard" style="display:none">
        <h2>Feedback</h2>
        <p class="feedback-hint" id="feedbackHint">Save this capture to GCS for retraining.</p>
        <div class="feedback-actions">
          <button type="button" class="confirm" id="confirmBtn">Confirm prediction</button>
          <button type="button" class="correct" id="showCorrectBtn">Correct</button>
          <button type="button" class="new-prod" id="showNewBtn">New produce</button>
        </div>
        <div class="feedback-panel hidden" id="correctPanel">
          <label for="correctInput">Correct produce name</label>
          <div class="autocomplete-wrap">
            <input type="text" id="correctInput" placeholder="e.g. tomato" autocomplete="off">
            <div class="suggestions hidden" id="correctSuggestions"></div>
          </div>
          <div class="panel-actions">
            <button type="button" class="primary" id="correctSubmitBtn">Save correction</button>
            <button type="button" class="ghost" id="correctCancelBtn">Cancel</button>
          </div>
        </div>
        <div class="feedback-panel hidden" id="newPanel">
          <label for="newInput">New produce name</label>
          <div class="autocomplete-wrap">
            <input type="text" id="newInput" placeholder="e.g. dragon_fruit" autocomplete="off">
            <div class="suggestions hidden" id="newSuggestions"></div>
          </div>
          <div class="panel-actions">
            <button type="button" class="primary" id="newSubmitBtn">Save new produce</button>
            <button type="button" class="ghost" id="newCancelBtn">Cancel</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const video = document.getElementById('video');
    const snapshot = document.getElementById('snapshot');
    const placeholder = document.getElementById('placeholder');
    const cameraSelect = document.getElementById('cameraSelect');
    const findBtn = document.getElementById('findBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultsEl = document.getElementById('results');
    const msVal = document.getElementById('msVal');
    const canvas = document.getElementById('canvas');
    const feedbackCard = document.getElementById('feedbackCard');
    const confirmBtn = document.getElementById('confirmBtn');
    const showCorrectBtn = document.getElementById('showCorrectBtn');
    const showNewBtn = document.getElementById('showNewBtn');
    const correctPanel = document.getElementById('correctPanel');
    const newPanel = document.getElementById('newPanel');
    const correctInput = document.getElementById('correctInput');
    const newInput = document.getElementById('newInput');
    const correctSuggestions = document.getElementById('correctSuggestions');
    const newSuggestions = document.getElementById('newSuggestions');
    const toast = document.getElementById('toast');
    let stream = null;
    let busy = false;
    let lastBlob = null;
    let lastTopLabel = null;
    let produceList = [];

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function normalizeHint(name) {
      return name.trim().toLowerCase().replace(/\s+/g, '_');
    }

    async function loadProduceList() {
      try {
        const res = await fetch('/produce-list');
        const data = await res.json();
        produceList = data.produce || [];
      } catch (_) {
        produceList = [];
      }
    }

    function filterSuggestions(query) {
      const q = normalizeHint(query);
      if (!q) return produceList.slice(0, 15);
      return produceList.filter(p => p.includes(q)).slice(0, 15);
    }

    function bindAutocomplete(input, listEl) {
      input.addEventListener('input', () => {
        const items = filterSuggestions(input.value);
        listEl.innerHTML = '';
        if (!items.length || !input.value.trim()) {
          listEl.classList.add('hidden');
          return;
        }
        items.forEach(name => {
          const div = document.createElement('div');
          div.textContent = name;
          div.onclick = () => {
            input.value = name;
            listEl.classList.add('hidden');
          };
          listEl.appendChild(div);
        });
        listEl.classList.remove('hidden');
      });
      input.addEventListener('blur', () => setTimeout(() => listEl.classList.add('hidden'), 150));
    }

    bindAutocomplete(correctInput, correctSuggestions);
    bindAutocomplete(newInput, newSuggestions);

    function hideFeedbackPanels() {
      correctPanel.classList.add('hidden');
      newPanel.classList.add('hidden');
    }

    function resetFeedback() {
      lastBlob = null;
      lastTopLabel = null;
      feedbackCard.style.display = 'none';
      hideFeedbackPanels();
      correctInput.value = '';
      newInput.value = '';
    }

    async function postFeedback(endpoint, fieldName, labelValue) {
      if (!lastBlob) {
        showToast('Capture an image first (press Find)');
        return;
      }
      const fd = new FormData();
      fd.append('image', lastBlob, 'capture.jpg');
      if (endpoint === '/confirm') fd.append('label', labelValue);
      if (endpoint === '/correct') fd.append('correct_label', labelValue);
      if (endpoint === '/new-produce') fd.append('produce_name', labelValue);
      try {
        const res = await fetch(endpoint, { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Upload failed');
        showToast(`Saved to ${data.path}`);
        hideFeedbackPanels();
        const norm = normalizeHint(labelValue);
        if (!produceList.includes(norm)) {
          produceList.push(norm);
          produceList.sort();
        }
      } catch (e) {
        showToast(e.message);
      }
    }

    confirmBtn.addEventListener('click', () => {
      if (!lastTopLabel) return;
      postFeedback('/confirm', 'label', lastTopLabel);
    });
    showCorrectBtn.addEventListener('click', () => {
      newPanel.classList.add('hidden');
      correctPanel.classList.remove('hidden');
      correctInput.focus();
    });
    showNewBtn.addEventListener('click', () => {
      correctPanel.classList.add('hidden');
      newPanel.classList.remove('hidden');
      newInput.focus();
    });
    document.getElementById('correctCancelBtn').addEventListener('click', hideFeedbackPanels);
    document.getElementById('newCancelBtn').addEventListener('click', hideFeedbackPanels);
    document.getElementById('correctSubmitBtn').addEventListener('click', () => {
      const v = correctInput.value.trim();
      if (!v) { showToast('Enter correct produce name'); return; }
      postFeedback('/correct', 'correct_label', v);
    });
    document.getElementById('newSubmitBtn').addEventListener('click', () => {
      const v = newInput.value.trim();
      if (!v) { showToast('Enter new produce name'); return; }
      postFeedback('/new-produce', 'produce_name', v);
    });

    async function loadCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      cams.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.deviceId;
        opt.textContent = c.label || `Camera ${i + 1}`;
        cameraSelect.appendChild(opt);
      });
      if (!cams.length) {
        placeholder.textContent = 'No camera found';
        return;
      }
      await startCamera(cams[0].deviceId);
    }

    async function startCamera(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.classList.remove('hidden');
      snapshot.classList.add('hidden');
      placeholder.classList.add('hidden');
      findBtn.disabled = false;
      clearBtn.disabled = false;
    }

    cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));

    /** Capture only the visible frame (same crop as object-fit: cover in the UI). */
    function captureVisibleFrame() {
      const displayW = video.clientWidth;
      const displayH = video.clientHeight;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!displayW || !displayH || !vw || !vh) return null;

      const scale = Math.max(displayW / vw, displayH / vh);
      const srcW = displayW / scale;
      const srcH = displayH / scale;
      const srcX = (vw - srcW) / 2;
      const srcY = (vh - srcH) / 2;

      canvas.width = displayW;
      canvas.height = displayH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, displayW, displayH);
      return { displayW, displayH };
    }

    function captureBlob() {
      const drawn = captureVisibleFrame();
      if (!drawn) return Promise.resolve(null);
      return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
    }

    async function find() {
      if (busy || !stream) return;
      busy = true;
      findBtn.disabled = true;
      resultsEl.innerHTML = '<div class="spinner"></div>';
      try {
        const blob = await captureBlob();
        if (!blob) throw new Error('Could not capture frame');
        lastBlob = blob;
        const fd = new FormData();
        fd.append('file', blob, 'capture.jpg');
        const res = await fetch('/api/infer', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Request failed');

        snapshot.src = canvas.toDataURL('image/jpeg', 0.92);
        snapshot.classList.remove('hidden');
        video.classList.add('hidden');

        msVal.textContent = data.inference_time_ms.toFixed(1);
        lastTopLabel = data.predictions[0]?.label || null;
        feedbackCard.style.display = 'block';
        hideFeedbackPanels();
        document.getElementById('feedbackHint').textContent =
          lastTopLabel ? `Top prediction: ${lastTopLabel} — confirm or correct.` : 'Save this capture to GCS.';
        renderResults(data.predictions);
      } catch (e) {
        resultsEl.innerHTML = `<div class="error">${e.message}</div>`;
        msVal.textContent = '—';
      }
      busy = false;
      findBtn.disabled = false;
    }

    function renderResults(predictions) {
      if (!predictions?.length) {
        resultsEl.innerHTML = '<div class="result-idle">No predictions</div>';
        return;
      }
      const top = predictions[0];
      const topPct = (top.prob * 100).toFixed(1);
      let html = `
        <div class="top-match">
          <div class="result-rank">Top match</div>
          <div class="label">${top.label}</div>
          <div class="pct">${topPct}% confidence</div>
        </div>`;
      const ranks = ['#2', '#3'];
      const barClass = ['second', 'third'];
      predictions.slice(1).forEach((r, i) => {
        const pct = (r.prob * 100).toFixed(1);
        html += `
          <div class="result-row">
            <div class="result-rank">${ranks[i] || '#' + (i + 2)}</div>
            <div class="result-label">${r.label}</div>
            <div class="bar-track"><div class="bar-fill ${barClass[i] || ''}" style="width:${pct}%"></div></div>
            <div class="meta"><span>threshold ${(r.threshold * 100).toFixed(0)}%</span><span>${pct}%</span></div>
          </div>`;
      });
      resultsEl.innerHTML = html;
    }

    function clearAll() {
      msVal.textContent = '—';
      resultsEl.innerHTML = '<div class="result-idle">Press <strong>Find</strong> to classify</div>';
      snapshot.classList.add('hidden');
      video.classList.remove('hidden');
      resetFeedback();
    }

    loadProduceList();

    findBtn.addEventListener('click', find);
    clearBtn.addEventListener('click', clearAll);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !busy) {
        e.preventDefault();
        find();
      }
    });

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(s => { s.getTracks().forEach(t => t.stop()); return loadCameras(); })
      .catch(() => { placeholder.textContent = 'Camera permission denied'; });
  </script>
</body>
</html>
